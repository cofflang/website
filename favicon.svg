<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    /* the ※ mark alone, no background: black in light tabs, and only when the
       browser itself is dark, light, so the mark never disappears. */
    text { fill: #000000; }
    @media (prefers-color-scheme: dark) { text { fill: #e6e6e6; } }
  </style>
  <text x="32" y="34" font-size="58" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif">※</text>
</svg>
